name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase.yml"

  # 手動実行
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Edge Functions をデプロイする"
        type: boolean
        default: true
      run_migrations:
        description: "DB マイグレーションを実行する"
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ─── DB マイグレーション ──────────────────────────────
      - name: Run DB migrations
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_migrations)
        run: |
          supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

      # ─── Edge Functions デプロイ ─────────────────────────
      - name: Link Supabase project
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ai-analyze
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase functions deploy ai-analyze --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy stripe-checkout
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase functions deploy stripe-checkout --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy stripe-webhook
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase functions deploy stripe-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy report-generate
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase functions deploy report-generate --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ─── Edge Function Secrets の同期 ───────────────────
      # Stripe・Anthropic のシークレットを Edge Function 環境変数に設定する。
      # すでに設定済みの場合は上書きされる（冪等）。
      - name: Sync Edge Function secrets
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
        run: |
          supabase secrets set \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            STRIPE_PRICE_MONTHLY="${{ secrets.STRIPE_PRICE_MONTHLY }}" \
            STRIPE_PRICE_ANNUAL="${{ secrets.STRIPE_PRICE_ANNUAL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

<script>
(function() {

      ],
      related: ['backup','export','ai-pattern'],

    'export': {

        'JSON形式でのエクスポート（他サービス連携用）',

        '医療機関との情報共有用フォーマットにも対応予定',
      ],
      related: ['monthly-pdf','doctor-summary','data-health'],
    },
    'body-summary': {
      points: [
        '体調の全体像を1枚のサマリーシートにまとめる',
        '直近1ヶ月の主要指標（睡眠・痛み・気分・体温）を集計',
        '特記すべき変化・パターンをAIが自動でピックアップ',
        '受診時の会話の出発点として活用できるフォーマット',
      ],
      related: ['monthly-pdf','doctor-summary','symptom-trends'],
    },
    'monthly-pdf': {
      points: [
        '1ヶ月分の全記録を美しいPDFレポートに自動変換',
        'カレンダービュー・グラフ・サマリーを1枚に統合',
        'スマートフォンから直接印刷・共有が可能',
        '受診前に自動リマインダーでレポート生成を通知',
      ],
      related: ['body-summary','doctor-summary','factor-report'],
    },
    'doctor-summary': {
      points: [
        '次回受診に向けた症状・経過まとめシートを自動生成',
        '「先生に伝えたいこと」を記録から自動抽出',
        '受診日・医療機関・処方薬の管理機能付き',
        '前回受診からの変化点をわかりやすく整理',
      ],
      related: ['body-summary','monthly-pdf','condition-summary'],
    },
    'symptom-trends': {
      points: [
        '症状ごとの推移を時系列グラフで可視化',
        '複数の症状を重ねて相関関係を確認',
        '周期フェーズ別の症状出現パターンを表示',
        'グラフを画像として保存・共有可能',
      ],
      related: ['flare-analysis','cycle-compare','doctor-summary'],
    },
    'condition-summary': {
      points: [
        '子宮内膜症・PMS・IBSなど疾患ごとの観察ポイントを整理',
        '疾患特有の症状パターンをあなたの記録と照合',
        '定期的な疾患観察レポートを自動生成',
        '複数疾患の同時管理・相互影響の可視化',
      ],
      related: ['doctor-summary','symptom-trends','factor-report'],
    },
  };

  var ALL_FEATURES = [
    {key:'ai-pattern',name:'AIパターン解析',ico:'🔮',bg:'rgba(139,127,214,.12)'},
    {key:'bbt-pattern',name:'体温パターン解析',ico:'🌡',bg:'rgba(212,132,154,.10)'},
    {key:'flare-analysis',name:'フレアアップ分析',ico:'🔥',bg:'rgba(212,132,90,.10)'},
    {key:'cycle-compare',name:'周期比較',ico:'📊',bg:'rgba(74,144,200,.10)'},
    {key:'experiments',name:'ヘルス実験',ico:'🧪',bg:'rgba(90,144,112,.10)'},
    {key:'factor-report',name:'要因効果レポート',ico:'📋',bg:'rgba(200,160,64,.10)'},
    {key:'cloud-sync',name:'クラウド同期',ico:'☁',bg:'rgba(74,144,200,.10)'},
    {key:'backup',name:'バックアップ',ico:'💾',bg:'rgba(139,127,214,.12)'},
    {key:'restore',name:'復元',ico:'🔄',bg:'rgba(90,144,112,.10)'},
    {key:'data-health',name:'データ診断',ico:'🔍',bg:'rgba(200,160,64,.10)'},
    {key:'export',name:'データ出力',ico:'📤',bg:'rgba(212,132,90,.10)'},
    {key:'body-summary',name:'からだサマリー',ico:'🌿',bg:'rgba(90,144,112,.10)'},
    {key:'monthly-pdf',name:'月次PDFレポート',ico:'📄',bg:'rgba(139,127,214,.12)'},

    {key:'symptom-trends',name:'症状推移グラフ',ico:'📈',bg:'rgba(212,132,154,.10)'},
    {key:'condition-summary',name:'疾患観察まとめ',ico:'🔬',bg:'rgba(200,160,64,.10)'},
  ];

  window.hydrateProFeature = function(feat) {
    if (!feat) return;
    var sc = document.getElementById('screen-pro-feature');
    if (!sc || !sc.classList.contains('active')) return;

    // Hero
    var icoEl = document.getElementById('pfr-ico');
    if (icoEl) { icoEl.textContent = feat.ico || '★'; icoEl.style.background = feat.bg || 'rgba(139,127,214,.12)'; }
    var nameEl = document.getElementById('pfr-name');
    if (nameEl) nameEl.textContent = feat.name || feat.key;
    var descEl = document.getElementById('pfr-desc');
    if (descEl) descEl.textContent = feat.desc || '';
    var breadEl = document.getElementById('pfr-bread-feature');
    if (breadEl) breadEl.textContent = feat.name || feat.key;

    // Points
    var c = CONTENT[feat.key] || { points: [feat.desc || 'この機能の詳細準備中です。'], related: [] };
    var list = document.getElementById('pfr-points-list');
    if (list) {
      list.innerHTML = c.points.map(function(p) {
        return '<li class="pfr-point"><span class="pfr-point-dot"></span><span>' + p + '</span></li>';
      }).join('');
    }

    // Related
    var rel = document.getElementById('pfr-related');
    if (rel && c.related) {
      rel.innerHTML = c.related.map(function(k) {
        var f = ALL_FEATURES.find(function(x) { return x.key === k; });
        if (!f) return '';
        return '<div class="pfr-related-chip" data-pro-key="' + k + '">'
          + '<span class="pfr-related-chip-ico">' + f.ico + '</span>' + f.name + '</div>';
      }).join('');
      rel.querySelectorAll('[data-pro-key]').forEach(function(chip) {
        chip.addEventListener('click', function() {
          window._proCurrentFeature = ALL_FEATURES.find(function(x) { return x.key === chip.dataset.proKey; }) || { key: chip.dataset.proKey };
          if (typeof window.hydrateProFeature === 'function') window.hydrateProFeature(window._proCurrentFeature);
        });
      });
    }

    // Soon ico
    var soonIco = document.getElementById('pfr-soon-ico');
    if (soonIco) soonIco.textContent = feat.ico || '🌱';
    var soonDesc = document.getElementById('pfr-soon-desc');
    if (soonDesc) soonDesc.textContent = feat.name ? feat.name + 'は現在開発中です。記録が積み重なることで、より精度の高い分析が可能になります。' : 'この機能は準備中です。';
  };

  // Wire buttons (executed once on inject)
  function _wire() {
    var backBtn = document.getElementById('pfr-back-btn');
    if (backBtn && !backBtn._wired) {
      backBtn._wired = true;
      backBtn.addEventListener('click', function() {
        if (typeof window.openProHub === 'function') window.openProHub();
        else if (typeof window.switchTab === 'function') window.switchTab('insights');
      });
    }
    var hubBtn = document.getElementById('pfr-cta-hub');
    if (hubBtn && !hubBtn._wired) {
      hubBtn._wired = true;
      hubBtn.addEventListener('click', function() {
        if (typeof window.switchTab === 'function') window.switchTab('insights');
        setTimeout(function() { if (typeof window.openProHub === 'function') window.openProHub(); }, 300);
      });
    }
    var insBtn = document.getElementById('pfr-cta-insights');
    if (insBtn && !insBtn._wired) {
      insBtn._wired = true;
      insBtn.addEventListener('click', function() {
        if (typeof window.switchTab === 'function') window.switchTab('insights');
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _wire);
  } else {
    setTimeout(_wire, 0);
  }

  // Auto-hydrate if feature is already set (e.g., navigated before script ran)
  setTimeout(function() {
    if (window._proCurrentFeature) {
      window.hydrateProFeature(window._proCurrentFeature);
    }
  }, 80);
})();
</script>

<div id="screen-home" class="screen active">

  <!-- メインカード（1枚でスクロール完結） -->
  <div style="margin:0 16px 16px;background:white;border-radius:22px;overflow:hidden;box-shadow:0 4px 18px rgba(120,40,55,0.14);">

    <!-- 上段：ダークローズ（挨拶 + フェーズバッジ） -->
    <div style="background:var(--rose-dark);padding:20px 18px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:13px;color:rgba(255,255,255,0.82);" id="greeting-text">こんにちは</div>
          <div style="font-family:'Shippori Mincho',serif;font-size:22px;color:white;font-weight:600;margin-top:2px;" id="greeting-name">あなたさん</div>
        </div>
        <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
          <div id="home-phase-badge" style="display:none;">
            <div id="home-phase-badge-text" style="font-size:11px;font-weight:500;color:white;background:rgba(255,255,255,0.22);padding:4px 12px;border-radius:20px;white-space:nowrap;"></div>
          </div>
          <div id="home-next-info" style="font-size:11px;color:rgba(255,255,255,0.72);white-space:nowrap;"></div>
        </div>
      </div>
    </div>

    <!-- 下段：ホワイト（記録ボタン・週・カレンダー） -->
    <div style="padding:16px 16px 20px;">

      <!-- 記録ボタン -->
      <div id="home-record-cta" onclick="handleHomeCTA()">
        <div id="home-cta-card" style="background:var(--rose-dark);border-radius:14px;padding:15px 20px;text-align:center;cursor:pointer;transition:transform 0.12s,opacity 0.3s;" onmousedown="this.style.transform='scale(0.97)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.97)'" ontouchend="this.style.transform=''">
          <div id="home-cta-title" style="font-size:16px;font-weight:600;color:white;letter-spacing:0.3px;">+ 今日を記録する</div>
        </div>
      </div>
      <div id="home-cta-sub" style="text-align:center;font-size:12px;color:var(--ink-light);margin-top:8px;min-height:16px;"></div>

      <!-- 今週 -->
      <div style="margin-top:18px;">
        <div style="font-size:13px;font-weight:500;color:var(--ink);margin-bottom:10px;">今週</div>
        <div id="home-week-row" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
      </div>

      <!-- 月間カレンダー -->
      <div style="margin-top:22px;">
        <div class="cal-header" style="margin-bottom:12px;">
          <div class="cal-label" id="homeCalLabel"></div>
          <div class="cal-nav">
            <button class="cal-nav-btn" id="homeCalPrev" type="button" aria-label="前の月" onclick="changeHomeCalMonth(-1)">‹</button>
            <button class="cal-nav-btn" id="homeCalNext" type="button" aria-label="次の月" onclick="changeHomeCalMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-weekdays">
          <div class="cal-wd">日</div><div class="cal-wd">月</div><div class="cal-wd">火</div><div class="cal-wd">水</div><div class="cal-wd">木</div><div class="cal-wd">金</div><div class="cal-wd">土</div>
        </div>
        <div class="cal-grid" id="homeCalGrid"></div>
      </div>

    </div>
  </div>

  <!-- hidden: JS が参照する旧 ID を保持（クラッシュ回避） -->
  <div style="display:none;">
    <span id="home-streak-num"></span>
    <span id="home-streak-fire"></span>
    <span id="home-next-num"></span>
    <span id="home-next-label"></span>
    <span id="home-next-unit"></span>
    <span id="today-date"></span>
    <span id="home-settings-icon"></span>
  </div>

</div>

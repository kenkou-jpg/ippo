<div id="screen-me-next" class="screen">
  <div class="men-scroll">

    <header class="men-header">
      <h1>Me</h1>
    </header>

    <!-- プロフィール: 名前・現在のプランはPR-ME-RUNTIME-03/04のRead-only
         Adapterで後日接続。現時点では空のまま（データソース未接続） -->
    <section class="men-profile-block">
      <div class="men-avatar-circle" id="men-avatar-initial"></div>
      <div class="men-profile-info">
        <div class="men-profile-name" id="men-profile-name" hidden></div>
        <!-- タップでbilling-next（Premium/Pro画面）へ遷移。Plan Card自体の

             ここでは持たず、遷移導線のみとする -->
        <button class="men-profile-plan" id="men-profile-plan" type="button" hidden></button>

    <!-- プライバシー再保証: Prototype onboarding-cardと同一コピー。

      <div class="men-kicker"><span class="men-badge badge-rose">🔒</span><span class="men-kicker-label">プライバシーについて</span></div>
      <p class="men-onboarding-reassure">あなたの記録は、あなただけが見られます。第三者への共有・公開は行いません。</p>
    </section>

    <!-- 設定リスト: Prototype同様、静的表示のみ（Prototype自体も
         「気になることを変更する」以外はクリックハンドラを持たない） -->

      <div class="men-settings-row">データのエクスポート</div>
      <div class="men-settings-row">アカウント</div>

           （純粋関数、Legacy screen非依存）をそのまま再利用し、書式のみ
           men-*に合わせた -->
      <button class="men-settings-row men-settings-row-consent" type="button" id="men-consent-row">
        <span class="men-settings-row-text">研究への協力（匿名データ提供）</span>
        <span class="men-settings-row-sub" id="men-consent-sub"></span>

      <div class="men-settings-row">気になることを変更する</div>
      <div class="men-settings-row">ヘルプ</div>
    </section>

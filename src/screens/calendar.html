<div id="screen-calendar" class="screen cn-screen">

  <!-- 共通ヘッダー（bell + avatar） -->
  <div id="cal-header"></div>

  <div class="cn-scroll">

    <!-- ページタイトル -->
    <div class="cn-page-header">
      <div class="cn-page-title-wrap">
        <div class="cn-page-title">カレンダー</div>
        <div class="cn-page-subtitle">月とからだのリズムを、<br>やさしく眺めてみましょう。</div>
      </div>
      <button class="cn-today-btn" id="calTodayBtn" type="button">
        <svg class="cn-today-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        今日
      </button>
    </div>

    <!-- カレンダーカード -->
    <div class="cn-card">

      <!-- 月ナビ -->
      <div class="cn-month-nav">
        <button class="cn-nav-btn" id="calPrevNew" type="button" aria-label="前の月">‹</button>
        <div class="cn-month-center">
          <div class="cn-month-label" id="calLabelNew"></div>
          <div class="cn-wareki-label" id="calWarekilabel"></div>
        </div>
        <button class="cn-nav-btn" id="calNextNew" type="button" aria-label="次の月">›</button>
      </div>

      <!-- 曜日ヘッダー -->
      <div class="cn-weekdays">
        <div class="cn-wd cn-wd--sun">日</div>
        <div class="cn-wd">月</div>
        <div class="cn-wd">火</div>
        <div class="cn-wd">水</div>
        <div class="cn-wd">木</div>
        <div class="cn-wd">金</div>
        <div class="cn-wd cn-wd--sat">土</div>
      </div>

      <!-- カレンダーグリッド -->
      <div class="cn-grid" id="calGridNew"></div>

      <!-- 凡例 -->
      <div class="cn-legend">
        <div class="cn-legend-item"><span class="cn-dot period"></span>生理</div>
        <div class="cn-legend-item"><span class="cn-dot ovulation"></span>排卵期</div>
        <div class="cn-legend-item"><span class="cn-dot ovulation-day"></span>排卵日予測</div>
        <div class="cn-legend-item"><span class="cn-dot fertile"></span>妊娠しやすい</div>
        <div class="cn-legend-item"><span class="cn-dot low-temp"></span>低温期</div>
        <div class="cn-legend-item"><span class="cn-dot high-temp"></span>高温期</div>
      </div>
    </div>

    <!-- 今日のからだメモ -->
    <div class="cn-card" id="calBodyMemo"></div>

    <!-- 今月のふりかえり -->
    <div class="cn-card" id="calMonthlySummary"></div>

  </div>
</div>

<!-- Day Detail Modal（既存の openDayDetail() と互換） -->
<div class="dm-overlay" id="dmOverlay">
  <div class="dm-box">
    <button class="dm-x" id="dmClose" type="button" aria-label="閉じる">✕</button>
    <div class="dm-date" id="dmDate"></div>
    <div id="dmBody"></div>
  </div>
</div>
